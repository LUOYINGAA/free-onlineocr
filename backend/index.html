<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free Online OCR - 免费在线文字识别工具，支持图片和PDF，全球可用">
    <title>Free Online OCR - 免费在线文字识别</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Header */
        .header { margin-bottom: 30px; text-align: center; }
        .header h1 { font-size: 28px; color: #38bdf8; display: inline-flex; align-items: center; gap: 12px; }
        .header h1 span { background: #38bdf8; color: #0f172a; padding: 4px 10px; border-radius: 6px; font-size: 18px; font-weight: bold; }
        .header p { font-size: 14px; color: #94a3b8; margin-top: 8px; }
        
        /* Main Grid */
        .main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 768px) { .main { grid-template-columns: 1fr; } }
        
        /* Card */
        .card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border-radius: 16px; padding: 24px; border: 1px solid rgba(71, 85, 105, 0.5); }
        .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #f1f5f9; }
        
        /* Upload Area */
        .upload-area { border: 2px dashed #475569; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
        .upload-area:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }
        .upload-area.dragover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .upload-icon { font-size: 48px; margin-bottom: 16px; }
        .upload-text { font-size: 16px; color: #e2e8f0; margin-bottom: 8px; }
        .upload-tip { font-size: 12px; color: #64748b; }
        #fileInput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        /* Preview */
        .preview { margin-top: 16px; }
        .preview img { max-width: 100%; max-height: 200px; object-contain; border-radius: 8px; }
        .preview-info { font-size: 12px; color: #94a3b8; margin-top: 8px; }
        
        /* Button */
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        button.primary { background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%); color: #fff; }
        button.primary:hover:not(:disabled) { background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%); transform: translateY(-1px); }
        button.secondary { background: #334155; color: #e2e8f0; margin-top: 10px; }
        button.secondary:hover:not(:disabled) { background: #475569; }
        button:disabled { background: #475569; color: #64748b; cursor: not-allowed; }
        
        /* Status */
        .status { margin-top: 14px; font-size: 13px; text-align: center; }
        .status.info { color: #38bdf8; }
        .status.success { color: #22c55e; }
        .status.error { color: #ef4444; }
        
        /* Result Area */
        .result-area { background: #0f172a; border-radius: 10px; padding: 20px; min-height: 350px; max-height: 500px; overflow-y: auto; white-space: pre-wrap; font-family: 'SF Mono', 'Monaco', 'Consolas', monospace; font-size: 14px; line-height: 1.6; color: #e2e8f0; }
        .result-area.empty { color: #64748b; display: flex; align-items: center; justify-content: center; text-align: center; }
        
        /* Stats */
        .stats { margin-top: 16px; display: flex; gap: 12px; }
        .stat { flex: 1; background: #0f172a; border-radius: 8px; padding: 12px; text-align: center; }
        .stat-label { font-size: 11px; color: #64748b; }
        .stat-value { font-size: 16px; font-weight: 600; color: #38bdf8; margin-top: 4px; }
        
        /* Features */
        .features { margin-top: 24px; }
        .features h3 { font-size: 14px; color: #f1f5f9; margin-bottom: 12px; }
        .feature-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .feature-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #94a3b8; }
        .feature-icon { width: 24px; height: 24px; border-radius: 6px; background: rgba(56, 189, 248, 0.1); display: flex; align-items: center; justify-content: center; color: #38bdf8; font-size: 12px; }
        .paid-btn { display: inline-block; padding: 12px 24px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; transition: all 0.3s; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        .paid-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span>OCR</span> Free Online OCR</h1>
            <p>免费在线文字识别 · 支持图片和PDF · 全球可用</p>
        </div>

        <div class="main">
            <!-- 左侧上传区 -->
            <div class="card">
                <h2>上传文件</h2>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">拖拽文件到这里，或点击上传</div>
                    <div class="upload-tip">支持 JPG、PNG 图片，以及多页 PDF 文档（最大10MB）</div>
                    <input type="file" id="fileInput" accept="image/*,.pdf">
                </div>
                
                <div id="preview" class="preview" style="display: none;"></div>
                
                <button id="startBtn" class="primary" disabled>开始识别</button>
                <button id="clearBtn" class="secondary" disabled>清空</button>
                
                <div id="status" class="status info"></div>
            </div>

            <!-- 右侧结果区 -->
            <div class="card">
                <h2>识别结果</h2>
                <div id="result" class="result-area empty">
                    上传文件并点击识别，识别结果将显示在这里
                </div>
                
                <div id="stats" class="stats" style="display: none;">
                    <div class="stat">
                        <div class="stat-label">字符数</div>
                        <div class="stat-value" id="charCount">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">置信度</div>
                        <div class="stat-value" id="confidence">-%</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">页数</div>
                        <div class="stat-value" id="pageCount">-</div>
                    </div>
                </div>
                
                <button id="copyBtn" class="secondary" disabled>复制结果</button>
            </div>
        </div>

        <!-- 功能特点 -->
        <div class="card features" style="margin-top: 24px;">
            <h3>核心优势</h3>
            <div class="feature-list">
                <div class="feature-item"><span class="feature-icon">✅</span><span>完全免费，无调用限制</span></div>
                <div class="feature-item"><span class="feature-icon">🌍</span><span>美国服务器，全球可用</span></div>
                <div class="feature-item"><span class="feature-icon">🖼️</span><span>支持图片和PDF文档</span></div>
                <div class="feature-item"><span class="feature-icon">⚡</span><span>服务端识别，速度更快</span></div>
                <div class="feature-item"><span class="feature-icon">🔒</span><span>安全可靠，数据加密</span></div>
                <div class="feature-item"><span class="feature-icon">📱</span><span>响应式设计，移动端适配</span></div>
            </div>
        </div>

        <!-- 高精度识别跳转 -->
        <div class="card paid-notice" style="margin-top: 24px; background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border: 1px solid #f59e0b;">
            <h3 style="color: #92400e; margin-bottom: 12px;">💡 需要更高精度？</h3>
            <p style="color: #78350f; margin-bottom: 16px; font-size: 14px; line-height: 1.6;">
                如需实现文字、符号零误差识别，可使用高精度付费服务，相关费用由使用者自行承担。
            </p>
            <a href="https://ai.baidu.com/tech/ocr" target="_blank" class="paid-btn">
                前往高精度识别 →
            </a>
        </div>
    </div>

    <script>
        // ========== 部署后替换为你的后端接口地址 ==========
        const BASE_URL = "https://xxx.onrender.com";

        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const stats = document.getElementById('stats');
        const charCount = document.getElementById('charCount');
        const pageCount = document.getElementById('pageCount');
        const confidenceEl = document.getElementById('confidence');

        let selectedFile = null;
        let lastResult = "";

        // Upload Handlers
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            selectedFile = e.dataTransfer.files[0];
            handleFile(selectedFile);
        });
        
        fileInput.addEventListener('change', () => {
            selectedFile = fileInput.files[0];
            handleFile(selectedFile);
        });

        async function handleFile(file) {
            if (!file) return;

            // Validate file type
            const fileName = file.name.toLowerCase();
            const isValid = file.type.startsWith('image/') || fileName.endsWith('.pdf');
            if (!isValid) {
                setStatus('请上传图片或PDF文件', 'error');
                return;
            }

            // Validate file size
            if (file.size > 10 * 1024 * 1024) {
                setStatus('文件大小超过限制（最大10MB）', 'error');
                return;
            }

            // 图片预处理（增强对比度，提升识别率）
            if (!fileName.endsWith('.pdf')) {
                file = await enhanceImage(file);
                setStatus('文件已选择（已增强处理）', 'info');
            }

            // Show preview for images
            preview.style.display = 'none';
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.innerHTML = `
                        <img src="${e.target.result}" alt="Preview">
                        <div class="preview-info">${file.name} (${formatSize(file.size)})</div>
                    `;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = `<div class="preview-info">📄 ${file.name} (${formatSize(file.size)})</div>`;
                preview.style.display = 'block';
            }

            startBtn.disabled = false;
            clearBtn.disabled = false;
            if (!fileName.endsWith('.pdf')) {
                setStatus('文件已选择（已增强处理）', 'info');
            } else {
                setStatus('文件已就绪，点击开始识别', 'info');
            }
            result.innerHTML = '上传文件并点击识别，识别结果将显示在这里';
            result.classList.add('empty');
            stats.style.display = 'none';
            copyBtn.disabled = true;
        }

        // 图片预处理：高对比度 + 锐化 + 二值化，提升符号和小字识别
        async function enhanceImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);

                        // 第一步：高对比度增强，让文字和背景区分度拉满
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;
                        const contrast = 1.8;  // 更高对比度
                        const intercept = 128 * (1 - contrast);
                        for (let i = 0; i < data.length; i += 4) {
                            data[i] = Math.min(255, Math.max(0, data[i] * contrast + intercept));
                            data[i + 1] = Math.min(255, Math.max(0, data[i + 1] * contrast + intercept));
                            data[i + 2] = Math.min(255, Math.max(0, data[i + 2] * contrast + intercept));
                        }
                        ctx.putImageData(imageData, 0, 0);

                        // 第二步：强力锐化，让小字和符号边缘更清晰
                        ctx.filter = 'contrast(1.2) brightness(1.1)';
                        ctx.drawImage(canvas, 0, 0);

                        // 第三步：轻微二值化处理，提升低对比度文字
                        const finalData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const finalPixels = finalData.data;
                        const threshold = 128;
                        for (let i = 0; i < finalPixels.length; i += 4) {
                            const avg = (finalPixels[i] + finalPixels[i+1] + finalPixels[i+2]) / 3;
                            const val = avg > threshold ? 255 : avg;
                            finalPixels[i] = val;
                            finalPixels[i+1] = val;
                            finalPixels[i+2] = val;
                        }
                        ctx.putImageData(finalData, 0, 0);

                        canvas.toBlob(blob => resolve(new File([blob], file.name, { type: file.type })));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function setStatus(msg, type = 'info') {
            status.textContent = msg;
            status.className = `status ${type}`;
        }

        // Start Recognition
        startBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            startBtn.disabled = true;
            setStatus('正在上传并识别，请稍候...', 'info');
            result.innerHTML = '';
            result.classList.remove('empty');
            stats.style.display = 'none';
            copyBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', selectedFile);
            
            const fileName = selectedFile.name.toLowerCase();
            const reqUrl = fileName.endsWith('.pdf') 
                ? `${BASE_URL}/ocr/pdf` 
                : `${BASE_URL}/ocr/image`;

            try {
                const response = await fetch(reqUrl, {
                    method: 'POST',
                    body: formData
                });
                
                const json = await response.json();
                
                if (json.code === 200) {
                    lastResult = json.data || '未识别到有效文字';
                    result.textContent = lastResult;
                    setStatus('识别完成', 'success');

                    // Update stats
                    charCount.textContent = lastResult.length;
                    pageCount.textContent = json.pages || '-';
                    confidenceEl.textContent = (json.confidence || 0) + '%';
                    stats.style.display = 'flex';
                    copyBtn.disabled = false;
                } else {
                    result.textContent = json.message || '识别失败';
                    setStatus(json.message || '识别失败', 'error');
                }
            } catch (error) {
                console.error('Request error:', error);
                result.textContent = '请求失败，请检查网络或稍后重试';
                setStatus('请求失败', 'error');
            }
            
            startBtn.disabled = false;
        });

        // Clear
        clearBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            preview.style.display = 'none';
            startBtn.disabled = true;
            clearBtn.disabled = true;
            copyBtn.disabled = true;
            status.textContent = '';
            result.innerHTML = '上传文件并点击识别，识别结果将显示在这里';
            result.classList.add('empty');
            stats.style.display = 'none';
            lastResult = '';
        });

        // Copy to Clipboard
        copyBtn.addEventListener('click', async () => {
            if (!lastResult) return;
            
            try {
                await navigator.clipboard.writeText(lastResult);
                setStatus('已复制到剪贴板', 'success');
                setTimeout(() => setStatus('识别完成', 'success'), 2000);
            } catch (error) {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = lastResult;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                setStatus('已复制到剪贴板', 'success');
                setTimeout(() => setStatus('识别完成', 'success'), 2000);
            }
        });
    </script>
</body>
</html>
